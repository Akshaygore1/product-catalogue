services:
  api:
    environment:
      FAKESTORE_BASE_URL: http://catalogue-fixture:3000
      FEATURED_PRODUCTS_FILE: /fixtures/featured.json
      WEB_BASE_URL: http://127.0.0.1:${E2E_WEB_PORT:-18080}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''
      MAIL_FROM: Catalogue <no-reply@catalogue.test>
      SALES_INBOX: sales@catalogue.test
    volumes:
      - ./e2e/fixtures/featured.json:/fixtures/featured.json:ro
    ports: !reset []
    depends_on:
      catalogue-fixture:
        condition: service_healthy

  web:
    ports: !override
      - '127.0.0.1:${E2E_WEB_PORT:-18080}:8080'

  mailpit:
    ports: !override
      - '127.0.0.1:${E2E_MAILPIT_PORT:-18025}:8025'

  catalogue-fixture:
    image: node:22-alpine
    command: ['node', '/fixtures/catalogue.mjs']
    volumes:
      - ./e2e/fixtures:/fixtures:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/products']
      interval: 1s
      timeout: 2s
      retries: 10
